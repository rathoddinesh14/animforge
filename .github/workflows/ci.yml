name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    name: Windows Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -A x64 `
            -DAGA_BUILD_TESTS=ON `
            -DAGA_BUILD_SAMPLES=ON `
            -DAGA_USE_OPENGL=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

  linux-build-test:
    name: Linux Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAGA_BUILD_TESTS=ON \
            -DAGA_BUILD_SAMPLES=ON \
            -DAGA_USE_OPENGL=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  format-check:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17

      - name: Check formatting
        run: |
          set -e
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' || true)
          if [ -z "$files" ]; then
            echo "No C/C++ files to check"
            exit 0
          fi
          echo "$files" | xargs clang-format-17 --dry-run --Werror
          echo "clang-format: OK"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: [linux-build-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-17 cmake ninja-build g++ python3 \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build-tidy \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DAGA_BUILD_TESTS=ON \
            -DAGA_BUILD_SAMPLES=OFF \
            -DAGA_USE_OPENGL=ON

      - name: Build
        run: cmake --build build-tidy --parallel

      - name: Run clang-tidy
        run: |
          clang-tidy-17 -p build-tidy \
            tests/math/test_glm_integration.cpp \
            tests/rhi/test_rhi_types.cpp \
            src/math/math_dummy.cpp \
            --quiet
